<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../theme/rdui-phone.css" />
<script src="../../vendor/lucide.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
  html, body { background: transparent; height: 100%; overflow: hidden; }

  .flash-overlay {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity .08s ease; z-index: 90;
  }
  .flash-overlay.flash { opacity: .85; transition: opacity 0s; }

  .chrome { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }

  .top-bar {
    pointer-events: auto; display: flex; align-items: center; justify-content: space-between;
    padding: 22px 18px 0;
  }
  .top-bar button {
    width: 38px; height: 38px; border-radius: 50%; border: none; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: rgba(0,0,0,.4); backdrop-filter: blur(6px);
  }
  .mode-pill {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: #fff;
    background: rgba(0,0,0,.4); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: var(--r-full);
  }

  .last-shot {
    position: fixed; left: 18px; bottom: 108px; width: 46px; height: 46px; border-radius: var(--r-md);
    border: 2px solid rgba(255,255,255,.5); overflow: hidden; pointer-events: auto; cursor: pointer;
    display: none; background: #000;
  }
  .last-shot.show { display: block; }
  .last-shot img { width: 100%; height: 100%; object-fit: cover; }

  .bottom-bar {
    pointer-events: auto; display: flex; align-items: center; justify-content: space-around;
    padding: 0 30px 34px;
  }
  .side-btn {
    width: 46px; height: 46px; border-radius: 50%; border: none; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.4); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .shutter-btn {
    width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.15);
    cursor: pointer; position: relative;
  }
  .shutter-btn::after {
    content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #fff;
  }
  .shutter-btn:active::after { background: rgba(255,255,255,.7); }

  #msg-toast {
    position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.7); backdrop-filter: blur(8px); color: #fff;
    padding: 8px 16px; border-radius: var(--r-full); font-size: 12px;
    font-family: var(--font-mono); opacity: 0; transition: opacity .25s ease; pointer-events: none;
  }
  #msg-toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="flash-overlay" id="flash"></div>
  <div id="msg-toast"></div>

  <div class="chrome">
    <div class="top-bar">
      <button id="btn-close"><i data-lucide="x"></i></button>
      <div class="mode-pill" id="mode-label">PHOTO</div>
      <span style="width:38px;"></span>
    </div>

    <div class="last-shot" id="last-shot"><img id="last-shot-img" /></div>

    <div class="bottom-bar">
      <span style="width:46px;"></span>
      <button class="shutter-btn" id="btn-shutter" aria-label="Capture"></button>
      <button class="side-btn" id="btn-flip"><i data-lucide="repeat"></i></button>
    </div>
  </div>

<script src="../../sdk/rde-phone-sdk.js"></script>
<script>
(function () {
  'use strict';

  function refreshIcons() { if (window.lucide) lucide.createIcons(); }

  // Client-side actions (camera positioning, animation, capture) live in
  // rde_phone's OWN client.lua — this app is part of rde_phone itself, so
  // it can fetch its own resource's NUI callbacks directly.
  const resourceName = (window.GetParentResourceName && GetParentResourceName()) || 'rde_phone';
  async function camAction(endpoint, payload) {
    try {
      const r = await fetch(`https://${resourceName}/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(payload || {}),
      });
      return await r.json();
    } catch (e) {
      return { error: true };
    }
  }

  let mode = 'standard';
  let busy = false;

  function toast(text) {
    const el = document.getElementById('msg-toast');
    el.textContent = text;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1800);
  }

  async function init() {
    await RDEPhone.ready;
    RDEPhone.setViewfinder(true);
    document.getElementById('mode-label').textContent = RDEPhone.t('app_camera_title').toUpperCase();
    await camAction('phone_cam_start', { mode });
    refreshIcons();
  }

  document.getElementById('btn-flip').addEventListener('click', async () => {
    mode = mode === 'standard' ? 'selfie' : 'standard';
    document.getElementById('mode-label').textContent = mode === 'selfie' ? 'SELFIE' : 'PHOTO';
    await camAction('phone_cam_setMode', { mode });
  });

  document.getElementById('btn-shutter').addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    const flash = document.getElementById('flash');
    flash.classList.add('flash');
    setTimeout(() => flash.classList.remove('flash'), 120);

    const captured = await camAction('phone_cam_capture');
    if (!captured || !captured.imageData) {
      toast('Capture failed');
      busy = false;
      return;
    }

    const saved = await RDEPhone.request('savePhoto', { imageData: captured.imageData }).catch((e) => e);
    if (saved && saved.ok) {
      toast(saved.message || RDEPhone.t('photo_saved'));
      document.getElementById('last-shot-img').src = captured.imageData;
      document.getElementById('last-shot').classList.add('show');
    } else {
      toast((saved && saved.message) || RDEPhone.t('photo_too_large'));
    }
    busy = false;
  });

  document.getElementById('btn-close').addEventListener('click', closeCamera);
  document.getElementById('last-shot').addEventListener('click', closeCamera);

  async function closeCamera() {
    await camAction('phone_cam_stop');
    RDEPhone.setViewfinder(false);
    RDEPhone.close();
  }

  // Defensive cleanup if the iframe gets torn down some other way
  window.addEventListener('beforeunload', () => { camAction('phone_cam_stop'); RDEPhone.setViewfinder(false); });

  init();
})();
</script>
</body>
</html>
